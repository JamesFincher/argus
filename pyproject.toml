[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Local-first Argus sensor, policy, mesh, and Hermes integration prototypes."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
argus-mcp-stdio = "argus_services.mcp_stdio:main"
argus-sensor-mcp = "argus_services.mcp_stdio:main"
hermes-sensor-mcp = "argus_services.mcp_stdio:main"
argus-native-host = "argus_services.native_messaging:main"
argus-mvp-smoke = "argus_services.mvp_smoke:main"

[project.entry-points."hermes.plugins"]
argus = "argus_services.hermes_plugin:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"]

[tool.setuptools.packages.find]
where = ["services"]
